name: Déploiement GitHub Pages

on:
  push:
    branches: [main, claude/wonderful-clarke-748us1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true  # active Pages (source : GitHub Actions) s'il ne l'est pas encore
      - run: npm ci
      - name: Images de boss (assets/boss-src → public/images/boss)
        run: npm run images:boss
      - run: npm run data:validate
      - run: npm run lint
      - name: Export statique
        run: npm run build
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Navigateur de test (Playwright Chromium)
        run: |
          npm install --global playwright@1.56.1
          npx --yes playwright@1.56.1 install --with-deps chromium
      - name: Tests de bout en bout sur l'export (servi comme GitHub Pages)
        run: |
          python3 tests/serve-pages.py out 3200 "${{ steps.pages.outputs.base_path }}" &
          sleep 2
          E2E_BASE="http://localhost:3200${{ steps.pages.outputs.base_path }}" PW_PATH="$(npm root -g)/playwright" node tests/e2e.mjs "$RUNNER_TEMP/e2e"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
